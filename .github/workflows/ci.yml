name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            baxtiyarovich/taklifnoma-frontend:latest
            baxtiyarovich/taklifnoma-frontend:${{ github.sha }}

      - name: Deploy frontend to VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F \
            "SHA256:GX193NkXBPYKqLPVn5bj/PnQP+yHtBeheDBZ93fB98M"

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -e

          IMAGE="baxtiyarovich/taklifnoma-frontend:${IMAGE_TAG}"
          CONTAINER="taklifnoma-frontend"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          OLD_IMAGE=""
          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            OLD_IMAGE=$(docker inspect --format='{{.Image}}' "$CONTAINER")
          fi

          echo "Removing old container..."
          docker rm -f "$CONTAINER" 2>/dev/null || true

          echo "Starting new frontend..."
          if ! docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 127.0.0.1:4176:80 \
            "$IMAGE"; then

            echo "New container failed to start."

            if [ -n "$OLD_IMAGE" ]; then
              echo "Restoring previous image..."
              docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p 127.0.0.1:4176:80 \
                "$OLD_IMAGE"
            fi

            exit 1
          fi

          echo "Checking frontend health..."

          for i in $(seq 1 40); do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' "$CONTAINER")

            if [ "$STATUS" = "healthy" ]; then
              echo "Frontend deployed successfully!"
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed!"
          docker logs --tail 50 "$CONTAINER"
          docker rm -f "$CONTAINER" 2>/dev/null || true

          if [ -n "$OLD_IMAGE" ]; then
            echo "Rolling back to previous image..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 127.0.0.1:4176:80 \
              "$OLD_IMAGE"
          fi

          exit 1
          REMOTE
